<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes Client</h1>
  </header>

  <main>
    <button id="load-btn">Load Notes</button>
    <p id="status"></p>

    <form id="note-form">
      <label for="title-input">Title:</label>
      <input id="title-input" type="text" required maxlength="100">

      <label for="body-input">Body:</label>
      <textarea id="body-input" required></textarea>

      <button id="submit-btn" type="submit">Add Note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
